<!-- EARLY BOOT: scroll-fix + theme detect -->
<script>
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch(e){}
  window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  // Theme
  try {
    var savedTheme = localStorage.getItem('mcr_theme');
    if (savedTheme === '1' || savedTheme === 'light') {
      document.documentElement.className = 'light';
    } else if (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.className = 'light';
    }
  } catch(e){}
</script>

<!-- Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').then(function(reg){
        reg.update();
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if (nw) {
            nw.addEventListener('statechange', function(){
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          }
        });
      }).catch(function(){});
    });
  }
</script>
