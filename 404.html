<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c9a84c">
<title>404 — Page not found · MCR Planet</title>
<meta name="description" content="Page not found. Return to MCR Planet — industrial equipment catalogue.">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link href="/assets/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --gold:#c9a84c;
    --bg:#0a0a0a;
    --text:#f1ede4;
    --text-2:#a8a49a;
    --text-3:#6b685f;
    --border:rgba(201,168,76,.22);
  }
  html.light{
    --gold:#b8944a;
    --bg:#f5f2ea;
    --text:#1a1a1a;
    --text-2:#555;
    --text-3:#888;
    --border:rgba(184,148,74,.3);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Nunito',sans-serif;font-weight:400;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 20% 30%, rgba(201,168,76,.10) 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(201,168,76,.08) 0%, transparent 45%);
  }
  .wrap{
    position:relative;z-index:1;
    max-width:900px;width:100%;
    text-align:center;
    padding:90px 56px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.025);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  html.light .wrap{background:rgba(255,255,255,0.55);}
  .logo{
    font-family:'Libre Baskerville',serif;
    font-size:1.15rem;
    letter-spacing:.4em;
    color:var(--gold);
    font-weight:600;
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .logo-sub{
    font-size:.68rem;
    letter-spacing:.32em;
    color:var(--text-3);
    text-transform:uppercase;
    margin-bottom:60px;
  }
  .big-404{
    font-family:'Libre Baskerville',serif;
    font-size:clamp(8rem, 24vw, 15rem);
    line-height:1;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.05em;
    margin-bottom:24px;
    position:relative;
    display:inline-block;
    text-shadow:0 4px 40px rgba(201,168,76,.25);
  }
  .big-404::after{
    content:'';position:absolute;
    left:50%;bottom:-22px;
    width:120px;height:2px;
    background:var(--gold);
    transform:translateX(-50%);
  }
  .not-found-title{
    margin-top:44px;
    font-family:'Libre Baskerville',serif;
    font-size:2rem;
    font-weight:400;
    color:var(--text);
    margin-bottom:20px;
  }
  .not-found-desc{
    font-size:1.05rem;
    color:var(--text-2);
    line-height:1.7;
    max-width:580px;
    margin:0 auto 56px;
  }
  .btns{
    display:flex;flex-wrap:wrap;gap:14px;
    justify-content:center;
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:transparent;color:var(--gold);
    border:1px solid var(--gold);
    font-family:'Nunito',sans-serif;font-size:.72rem;
    letter-spacing:.28em;text-transform:uppercase;font-weight:600;
    padding:18px 30px;
    cursor:pointer;text-decoration:none;
    transition:all .25s cubic-bezier(.23,1,.32,1);
    min-width:180px;justify-content:center;
  }
  .btn:hover{background:var(--gold);color:var(--bg);transform:translateY(-2px);box-shadow:0 6px 24px rgba(201,168,76,.35);}
  .btn-primary{background:var(--gold);color:var(--bg);}
  .btn-primary:hover{background:transparent;color:var(--gold);}
  .lang-switch{
    position:absolute;top:28px;right:36px;
    display:flex;gap:8px;align-items:center;
    z-index:10;
  }
  .lang-switch button{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-3);
    font:inherit;cursor:pointer;
    text-transform:uppercase;
    font-family:'Nunito',sans-serif;
    font-size:.68rem;
    letter-spacing:.2em;
    font-weight:600;
    padding:9px 14px;
    min-width:52px;
    transition:all .2s;
  }
  .lang-switch button:hover{
    color:var(--gold);
    border-color:var(--gold);
  }
  .lang-switch button.active{
    color:var(--bg);
    background:var(--gold);
    border-color:var(--gold);
    font-weight:700;
  }
  html.light .lang-switch button.active{color:var(--bg);}
  @media(max-width:768px){
    .wrap{padding:60px 28px;}
    .btn{padding:14px 22px;font-size:.62rem;min-width:unset;flex:1 1 45%;}
    .btns{gap:10px;}
    .not-found-title{font-size:1.4rem;}
    .not-found-desc{font-size:.92rem;}
    .lang-switch{top:16px;right:16px;}
    .lang-switch button{padding:7px 10px;min-width:44px;font-size:.6rem;letter-spacing:.15em;}
    .logo{font-size:.95rem;}
    .logo-sub{margin-bottom:40px;}
  }
  @media(max-width:460px){
    .btn{flex:1 1 100%;}
  }
</style>
<script>
  (function(){
    try {
      var s = localStorage.getItem('mcr_theme');
      if (s === '1' || s === 'light') document.documentElement.className = 'light';
      else if (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.className = 'light';
      }
    } catch(e){}
  })();
  (function(){
    try {
      var saved = localStorage.getItem('mcr_lang');
      if (saved && ['en','es','pl'].indexOf(saved) >= 0) { window.__mcrLang = saved; return; }
      var b = (navigator.languages || [navigator.language || 'en']).map(function(l){return (l||'').toLowerCase().slice(0,2);});
      for (var i = 0; i < b.length; i++) {
        if (b[i] === 'es') { window.__mcrLang = 'es'; return; }
        if (b[i] === 'pl') { window.__mcrLang = 'pl'; return; }
        if (b[i] === 'en') { window.__mcrLang = 'en'; return; }
      }
      window.__mcrLang = 'en';
    } catch(e){ window.__mcrLang = 'en'; }
  })();
</script>
</head>
<body>

<div class="lang-switch">
  <button data-lang="en" onclick="setLang('en')">EN</button>
  <button data-lang="es" onclick="setLang('es')">ES</button>
  <button data-lang="pl" onclick="setLang('pl')">PL</button>
</div>

<div class="wrap">
  <div class="logo">MCR PLANET</div>
  <div class="logo-sub" id="s-tagline">Engineering · Geology · Innovation</div>

  <div class="big-404">404</div>

  <h1 class="not-found-title" id="s-title">Page not found</h1>
  <p class="not-found-desc" id="s-desc">
    The page you were looking for doesn't exist or has been moved.
    Let's get you back on track.
  </p>

  <div class="btns">
    <a href="/" class="btn btn-primary" id="s-home">← Home</a>
    <a href="#" onclick="goCatalog(event)" class="btn" id="s-catalog">Equipment Catalogue</a>
    <a href="#" onclick="goContact(event)" class="btn" id="s-contact">Contact Us</a>
  </div>
</div>

<script>
  var STR = {
    en: {
      tagline: 'Engineering · Geology · Innovation',
      title: 'Page not found',
      desc: "The page you were looking for doesn't exist or has been moved. Let's get you back on track.",
      home: '\u2190 Home',
      cat: 'Equipment Catalogue',
      contact: 'Contact Us'
    },
    es: {
      tagline: 'Ingeniería · Geología · Innovación',
      title: 'Página no encontrada',
      desc: 'La página que buscabas no existe o ha sido movida. Volvamos al camino.',
      home: '\u2190 Inicio',
      cat: 'Catálogo de equipos',
      contact: 'Contáctanos'
    },
    pl: {
      tagline: 'Inżynieria · Geologia · Innowacje',
      title: 'Strona nie znaleziona',
      desc: 'Strona, której szukasz, nie istnieje lub została przeniesiona. Wróćmy na właściwą ścieżkę.',
      home: '\u2190 Strona główna',
      cat: 'Katalog sprzętu',
      contact: 'Kontakt'
    }
  };
  function setLang(l){
    if (!STR[l]) l = 'en';
    document.getElementById('s-tagline').textContent = STR[l].tagline;
    document.getElementById('s-title').textContent = STR[l].title;
    document.getElementById('s-desc').textContent = STR[l].desc;
    document.getElementById('s-home').textContent = STR[l].home;
    document.getElementById('s-catalog').textContent = STR[l].cat;
    document.getElementById('s-contact').textContent = STR[l].contact;
    var btns = document.querySelectorAll('.lang-switch button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = (btns[i].getAttribute('data-lang') === l) ? 'active' : '';
    }
    try { localStorage.setItem('mcr_lang', l); } catch(e){}
    document.documentElement.lang = l;
  }

  /* Equipment Catalogue: флаг в sessionStorage → главная откроет overlay */
  function goCatalog(e){
    if (e) e.preventDefault();
    try { sessionStorage.setItem('mcr_open_catalog', '1'); } catch(e){}
    window.location.href = '/';
  }

  /* Contact: используем ?contact=1 — главная сама обработает после preloader'а */
  function goContact(e){
    if (e) e.preventDefault();
    window.location.href = '/?contact=1';
  }

  setLang(window.__mcrLang || 'en');
</script>

</body>
</html>
